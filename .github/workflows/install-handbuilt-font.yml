name: Install handbuilt Seven Days font

on:
  push:
    paths:
      - '.github/workflows/install-handbuilt-font.yml'

permissions:
  contents: write

jobs:
  install-font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify font
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib, hashlib
          root = Path('.')
          parts = [root / '.font-upload' / f'part{i}.txt' for i in range(1, 4)]
          payload = ''.join(p.read_text().strip() for p in parts)
          font = zlib.decompress(base64.b64decode(payload))
          sha = hashlib.sha256(font).hexdigest()
          expected = 'a73ded813e193c58d471593880554514673e500cc1182f6dbc723153ffa62d86'
          if sha != expected:
              raise SystemExit(f'font hash mismatch: {sha}')
          font_dir = root / 'app/src/main/assets/fonts'
          font_dir.mkdir(parents=True, exist_ok=True)
          for old in font_dir.glob('*.ttf'):
              old.unlink()
          out = font_dir / 'SevenDays-Handbuilt.ttf'
          out.write_bytes(font)
          for p in parts:
              p.unlink()
          stage = root / '.font-upload'
          if stage.exists() and not any(stage.iterdir()):
              stage.rmdir()
          workflow = root / '.github/workflows/install-handbuilt-font.yml'
          workflow.unlink()
          print(f'Installed {out} ({len(font)} bytes), sha256={sha}')
          PY
      - name: Commit clean font state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace old fonts with handbuilt Seven Days font'
          git push
