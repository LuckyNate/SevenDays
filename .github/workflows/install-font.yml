name: Install rebuilt Seven Days font

on:
  push:
    paths:
      - '.github/workflows/install-font.yml'

permissions:
  contents: write

jobs:
  install-font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check staged font data
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('.font-upload')
          for i in range(1, 5):
              b=(root/f'part{i}.txt').read_bytes().strip()
              print(i, len(b), hashlib.sha256(b).hexdigest())
          PY
