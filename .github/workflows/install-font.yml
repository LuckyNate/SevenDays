name: Install rebuilt Seven Days font

on:
  push:
    paths:
      - '.github/workflows/install-font.yml'

permissions:
  contents: write

jobs:
  install-font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild font binary from staged data
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          root = Path('.')
          parts = [root / '.font-upload' / f'part{i}.txt' for i in range(1, 5)]
          payload = ''.join(p.read_text().strip() for p in parts)
          font = zlib.decompress(base64.b64decode(payload))
          out = root / 'app/src/main/assets/fonts/SevenDays-Regular.ttf'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(font)
          tmp = root / 'app/src/main/assets/fonts/SevenDays-Regular.ttf.tmp'
          if tmp.exists(): tmp.unlink()
          for p in parts:
              p.unlink()
          d = root / '.font-upload'
          if d.exists() and not any(d.iterdir()): d.rmdir()
          (root / '.github/workflows/install-font.yml').unlink()
          print(f'Wrote {len(font)} bytes to {out}')
          PY
      - name: Commit rebuilt font and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace Seven Days font with rebuilt glyph font'
          git push
