<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seven Days</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
    body{display:grid;place-items:center;background:#000}
    #art-container{width:100vw;height:100vh;display:grid;place-items:center;padding:3.5vmin;background:#000}
    #seven-days-art{display:block;width:min(92vw,760px);height:auto;max-height:90vh;object-fit:contain;filter:drop-shadow(0 0 18px rgba(160,0,0,.18))}
  </style>
</head>
<body>
  <main id="art-container" aria-label="Seven Days">
    <img id="seven-days-art" src="seven-days-logo.webp" alt="SEVEN DAYS">
  </main>
</body>
</html>
