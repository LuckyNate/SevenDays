<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seven Days</title>
<style>
@font-face{font-family:SevenDays;src:url('fonts/sevenDays.ttf') format('truetype')}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{display:flex;align-items:center;justify-content:center}
#title{position:relative;z-index:2;text-align:center;font-family:SevenDays,sans-serif;font-size:100px;line-height:.72;letter-spacing:-.03em;color:#c00;user-select:none}
#title span{display:block}
#warning{position:fixed;inset:0;z-index:10;background:#f2f2f2;color:#171717;display:flex;align-items:center;justify-content:center;padding:28px;font-family:Arial,Helvetica,sans-serif}
#warningCard{width:min(88vw,520px);text-align:center}
#warningText{font-size:clamp(20px,5vw,32px);line-height:1.28;font-weight:600;margin:0 0 30px}
#installAnyway{appearance:none;border:2px solid #1d1d1d;background:#fff;color:#111;font:700 clamp(18px,4.5vw,26px)/1 Arial,Helvetica,sans-serif;padding:18px 24px;border-radius:8px;min-width:min(80vw,320px);letter-spacing:.02em;touch-action:manipulation}
#installAnyway.waiting{background:#aaa;color:#555;border-color:#777}
#warning.melting{pointer-events:none}
</style>
</head>
<body>
<div id="title"><span>SEVEN</span><span>DAYS</span></div>
<div id="warning">
  <div id="warningCard">
    <p id="warningText">For your protection, your phone is blocking this app from updating.</p>
    <button id="installAnyway" type="button">INSTALL ANYWAY</button>
  </div>
</div>
<script src="volumetric-fog.js"></script>
<script src="title-bloom.js"></script>
<script src="blood-melt.js"></script>
<script>
const title=document.getElementById('title');
function fitTitle(){
  title.style.fontSize='100px';
  const box=title.getBoundingClientRect();
  const measured=Math.max(box.width,box.height);
  if(!measured)return;
  const target=Math.min(innerWidth,innerHeight)*0.8;
  title.style.fontSize=`${100*(target/measured)}px`;
}
addEventListener('resize',fitTitle);

document.fonts.ready.then(()=>{
  fitTitle();
  const fog=new VolumetricFog({grid:16,zIndex:0});
  const bloom=new TitleBloom(title,{zIndex:1});
  fog.start();
  bloom.start();
});

const warning=document.getElementById('warning');
const installAnyway=document.getElementById('installAnyway');
let melting=false;
let tapCount=0;
let audioContext=null;

function ensureAudio(){
  if(!audioContext)audioContext=new (window.AudioContext||window.webkitAudioContext)();
  if(audioContext.state==='suspended')audioContext.resume();
}

function playScareSound(){
  if(!audioContext)return;
  const now=audioContext.currentTime;
  const duration=.72;
  const oscillator=audioContext.createOscillator();
  const oscillatorGain=audioContext.createGain();
  oscillator.type='sawtooth';
  oscillator.frequency.setValueAtTime(92,now);
  oscillator.frequency.exponentialRampToValueAtTime(38,now+duration);
  oscillatorGain.gain.setValueAtTime(.0001,now);
  oscillatorGain.gain.exponentialRampToValueAtTime(.38,now+.025);
  oscillatorGain.gain.exponentialRampToValueAtTime(.0001,now+duration);
  oscillator.connect(oscillatorGain).connect(audioContext.destination);
  oscillator.start(now);
  oscillator.stop(now+duration);

  const frameCount=Math.ceil(audioContext.sampleRate*duration);
  const buffer=audioContext.createBuffer(1,frameCount,audioContext.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<frameCount;i++)data[i]=(Math.random()*2-1)*(1-i/frameCount);
  const noise=audioContext.createBufferSource();
  const filter=audioContext.createBiquadFilter();
  const noiseGain=audioContext.createGain();
  noise.buffer=buffer;
  filter.type='bandpass';
  filter.frequency.setValueAtTime(1250,now);
  filter.frequency.exponentialRampToValueAtTime(180,now+duration);
  filter.Q.value=.7;
  noiseGain.gain.setValueAtTime(.0001,now);
  noiseGain.gain.exponentialRampToValueAtTime(.55,now+.02);
  noiseGain.gain.exponentialRampToValueAtTime(.0001,now+duration);
  noise.connect(filter).connect(noiseGain).connect(audioContext.destination);
  noise.start(now);
}

function captureTitleSnapshot(){
  try{
    const dpr=Math.min(devicePixelRatio||1,2);
    const width=Math.max(1,innerWidth|0);
    const height=Math.max(1,innerHeight|0);
    const style=getComputedStyle(title);
    const canvas=document.createElement('canvas');
    canvas.width=Math.round(width*dpr);
    canvas.height=Math.round(height*dpr);
    const ctx=canvas.getContext('2d');
    ctx.scale(dpr,dpr);
    ctx.fillStyle='#fff';
    ctx.textAlign='center';
    ctx.textBaseline='alphabetic';
    ctx.font=`${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;

    for(const span of title.querySelectorAll('span')){
      const rect=span.getBoundingClientRect();
      const text=span.textContent||'';
      const metrics=ctx.measureText(text);
      const ascent=metrics.actualBoundingBoxAscent||parseFloat(style.fontSize)*0.8;
      const descent=metrics.actualBoundingBoxDescent||parseFloat(style.fontSize)*0.2;
      const baseline=rect.top+(rect.height+ascent-descent)*0.5;
      ctx.fillText(text,rect.left+rect.width*0.5,baseline);
    }
    return canvas;
  }catch(error){
    console.warn('Title adhesion capture unavailable',error);
    return null;
  }
}

function meltWarning(){
  if(melting)return;
  melting=true;
  warning.classList.add('melting');
  warning.style.background='#c00';

  const adhesionCanvas=captureTitleSnapshot();
  const bloodMelt=new BloodMelt({
    color:'#cc0000',
    duration:5600,
    zIndex:20,
    edgeAdhesion:0.20,
    adhesionCanvas
  });
  warning.style.visibility='hidden';
  bloodMelt.start({onComplete:()=>{
    bloodMelt.destroy();
    warning.remove();
  }});
}

installAnyway.addEventListener('pointerdown',event=>{
  if(melting)return;
  if(event.pointerType==='mouse'&&event.button!==0)return;
  event.preventDefault();
  ensureAudio();
  tapCount++;

  if(tapCount===1){
    installAnyway.classList.add('waiting');
    setTimeout(()=>{if(tapCount===1&&!melting)installAnyway.classList.remove('waiting')},220);
    return;
  }
  if(tapCount===2){
    installAnyway.classList.add('waiting');
    setTimeout(()=>{if(tapCount===2&&!melting)installAnyway.classList.remove('waiting')},2000);
    return;
  }

  installAnyway.classList.add('waiting');
  installAnyway.style.pointerEvents='none';
  setTimeout(()=>{
    playScareSound();
    meltWarning();
  },650);
});
</script>
</body>
</html>
