<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>SevenDays</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #000; color: #eee; font-family: system-ui, sans-serif; }
    body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { width: min(92vw, 540px); text-align: center; }
    .mark { font-size: clamp(42px, 12vw, 78px); letter-spacing: .08em; margin: 0 0 12px; }
    .sub { opacity: .62; margin-bottom: 40px; }
    .status { border: 1px solid #333; padding: 20px; border-radius: 14px; background: #090909; }
    a { color: #ddd; }
  </style>
</head>
<body>
  <main>
    <h1 class="mark">SEVEN DAYS</h1>
    <div class="sub">Local shell online.</div>
    <div class="status">
      The app UI is being served entirely from bundled local files.
      <p><a href="https://github.com/LuckyNate/SevenDays">Project page</a></p>
    </div>
  </main>
</body>
</html>
