<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seven Days</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
    body{display:grid;place-items:center;background:#000}
    #art-container{width:100vw;height:100vh;display:grid;place-items:center;padding:3.5vmin;background:#000}
    #seven-days-art{width:min(94vw,94vh * 1.5);height:auto;max-height:92vh;display:block;object-fit:contain}
  </style>
</head>
<body>
  <main id="art-container" aria-label="Seven Days">
    <svg id="seven-days-art" viewBox="0 0 1536 1024" role="img" aria-label="SEVEN DAYS" xmlns="http://www.w3.org/2000/svg">
      <rect width="1536" height="1024" fill="#000"/>
      <text x="768" y="430" text-anchor="middle" fill="#d00000" font-family="sans-serif" font-size="250" font-weight="900" letter-spacing="-18">SEVEN</text>
      <text x="768" y="700" text-anchor="middle" fill="#d00000" font-family="sans-serif" font-size="250" font-weight="900" letter-spacing="-18">DAYS</text>
    </svg>
  </main>
</body>
</html>
