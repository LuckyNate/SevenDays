<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seven Days</title>
<style>
@font-face{font-family:SevenDays;src:url('fonts/SevenDays-Handbuilt.ttf') format('truetype')}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{display:flex;align-items:center;justify-content:center}
#title{position:relative;z-index:2;text-align:center;font-family:SevenDays,sans-serif;font-size:min(28vw,260px);line-height:.72;letter-spacing:-.03em;color:#c00;text-shadow:0 0 6px #900,0 0 20px rgba(190,0,0,.5);user-select:none}
#title span{display:block}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#warning{position:fixed;inset:0;z-index:10;background:#f2f2f2;color:#171717;display:flex;align-items:center;justify-content:center;padding:28px;font-family:Arial,Helvetica,sans-serif}
#warningCard{width:min(88vw,520px);text-align:center}
#warningText{font-size:clamp(20px,5vw,32px);line-height:1.28;font-weight:600;margin:0 0 30px}
#installAnyway{appearance:none;border:2px solid #1d1d1d;background:#fff;color:#111;font:700 clamp(18px,4.5vw,26px)/1 Arial,Helvetica,sans-serif;padding:18px 24px;border-radius:8px;min-width:min(80vw,320px);letter-spacing:.02em;touch-action:manipulation}
#installAnyway.waiting{background:#aaa;color:#555;border-color:#777}
#warning.melting{pointer-events:none}
.meltSlice{position:fixed;left:0;width:100%;z-index:11;background:#f2f2f2;overflow:hidden;will-change:transform}
.meltSlice .meltCopy{position:absolute;left:0;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;color:#171717;font-family:Arial,Helvetica,sans-serif}
.meltSlice .meltCard{width:min(88vw,520px);text-align:center}
.meltSlice .meltText{font-size:clamp(20px,5vw,32px);line-height:1.28;font-weight:600;margin:0 0 30px}
.meltSlice .meltButton{display:inline-block;border:2px solid #1d1d1d;background:#fff;color:#111;font:700 clamp(18px,4.5vw,26px)/1 Arial,Helvetica,sans-serif;padding:18px 24px;border-radius:8px;min-width:min(80vw,320px);letter-spacing:.02em}
</style>
</head>
<body>
<canvas id="smoke"></canvas>
<div id="title"><span>SEVEN</span><span>DAYS</span></div>
<div id="warning">
  <div id="warningCard">
    <p id="warningText">For your protection, your phone is blocking this app from updating.</p>
    <button id="installAnyway" type="button">INSTALL ANYWAY</button>
  </div>
</div>
<script>
const canvas=document.getElementById('smoke');
const ctx=canvas.getContext('2d');
let particles=[];
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
function reset(p){p.x=Math.random()*canvas.width;p.y=canvas.height+Math.random()*100;p.r=40+Math.random()*100;p.v=.15+Math.random()*.35;p.a=.015+Math.random()*.025}
function init(){particles=Array.from({length:28},()=>{const p={};reset(p);p.y=Math.random()*canvas.height;return p})}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);for(const p of particles){p.y-=p.v;p.x+=Math.sin(p.y*.008)*.12;if(p.y+p.r<0)reset(p);const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,`rgba(255,255,255,${p.a})`);g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}requestAnimationFrame(draw)}
addEventListener('resize',()=>{resize();init()});resize();init();draw();

const warning=document.getElementById('warning');
const installAnyway=document.getElementById('installAnyway');
let melting=false;
let tapCount=0;
let audioContext=null;

function ensureAudio(){
  if(!audioContext)audioContext=new (window.AudioContext||window.webkitAudioContext)();
  if(audioContext.state==='suspended')audioContext.resume();
}

function playScareSound(){
  if(!audioContext)return;
  const now=audioContext.currentTime;
  const duration=.72;

  const oscillator=audioContext.createOscillator();
  const oscillatorGain=audioContext.createGain();
  oscillator.type='sawtooth';
  oscillator.frequency.setValueAtTime(92,now);
  oscillator.frequency.exponentialRampToValueAtTime(38,now+duration);
  oscillatorGain.gain.setValueAtTime(.0001,now);
  oscillatorGain.gain.exponentialRampToValueAtTime(.38,now+.025);
  oscillatorGain.gain.exponentialRampToValueAtTime(.0001,now+duration);
  oscillator.connect(oscillatorGain).connect(audioContext.destination);
  oscillator.start(now);
  oscillator.stop(now+duration);

  const frameCount=Math.ceil(audioContext.sampleRate*duration);
  const buffer=audioContext.createBuffer(1,frameCount,audioContext.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<frameCount;i++)data[i]=(Math.random()*2-1)*(1-i/frameCount);

  const noise=audioContext.createBufferSource();
  const filter=audioContext.createBiquadFilter();
  const noiseGain=audioContext.createGain();
  noise.buffer=buffer;
  filter.type='bandpass';
  filter.frequency.setValueAtTime(1250,now);
  filter.frequency.exponentialRampToValueAtTime(180,now+duration);
  filter.Q.value=.7;
  noiseGain.gain.setValueAtTime(.0001,now);
  noiseGain.gain.exponentialRampToValueAtTime(.55,now+.02);
  noiseGain.gain.exponentialRampToValueAtTime(.0001,now+duration);
  noise.connect(filter).connect(noiseGain).connect(audioContext.destination);
  noise.start(now);
}

function meltWarning(){
  if(melting)return;
  melting=true;
  warning.classList.add('melting');

  const sliceHeight=8;
  const count=Math.ceil(innerHeight/sliceHeight);
  const slices=[];

  for(let i=0;i<count;i++){
    const top=i*sliceHeight;
    const slice=document.createElement('div');
    slice.className='meltSlice';
    slice.style.top=`${top}px`;
    slice.style.height=`${Math.min(sliceHeight,innerHeight-top)}px`;

    const copy=document.createElement('div');
    copy.className='meltCopy';
    copy.style.top=`-${top}px`;
    copy.innerHTML='<div class="meltCard"><p class="meltText">For your protection, your phone is blocking this app from updating.</p><div class="meltButton">INSTALL ANYWAY</div></div>';
    slice.appendChild(copy);
    document.body.appendChild(slice);
    slices.push(slice);
  }

  warning.style.visibility='hidden';

  requestAnimationFrame(()=>{
    slices.forEach((slice,i)=>{
      const wave=(Math.sin(i*.72)+1)*55;
      const jitter=Math.random()*110;
      const distance=innerHeight+wave+jitter;
      const duration=900+Math.random()*450;
      const delay=(i%9)*10+Math.random()*70;
      slice.style.transition=`transform ${duration}ms cubic-bezier(.2,.7,.1,1) ${delay}ms`;
      slice.style.transform=`translateY(${distance}px)`;
    });
  });

  setTimeout(()=>{
    slices.forEach(slice=>slice.remove());
    warning.remove();
  },1600);
}

installAnyway.addEventListener('pointerdown',event=>{
  if(melting)return;
  if(event.pointerType==='mouse'&&event.button!==0)return;
  event.preventDefault();
  ensureAudio();
  tapCount++;

  if(tapCount===1){
    installAnyway.classList.add('waiting');
    setTimeout(()=>{
      if(tapCount===1&&!melting)installAnyway.classList.remove('waiting');
    },220);
    return;
  }

  if(tapCount===2){
    installAnyway.classList.add('waiting');
    return;
  }

  installAnyway.style.pointerEvents='none';
  setTimeout(()=>{
    playScareSound();
    meltWarning();
  },650);
});
</script>
</body>
</html>
