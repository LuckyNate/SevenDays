<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seven Days</title>
<style>
@font-face{font-family:SevenDays;src:url('fonts/SevenDays-Handbuilt.ttf') format('truetype')}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{display:flex;align-items:center;justify-content:center}
#title{position:relative;z-index:2;text-align:center;font-family:SevenDays,sans-serif;font-size:min(28vw,260px);line-height:.72;letter-spacing:-.03em;color:#c00;text-shadow:0 0 6px #900,0 0 20px rgba(190,0,0,.5);user-select:none}
#title span{display:block}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
</style>
</head>
<body>
<canvas id="smoke"></canvas>
<div id="title"><span>SEVEN</span><span>DAYS</span></div>
<script>
const canvas=document.getElementById('smoke');
const ctx=canvas.getContext('2d');
let particles=[];
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
function reset(p){p.x=Math.random()*canvas.width;p.y=canvas.height+Math.random()*100;p.r=40+Math.random()*100;p.v=.15+Math.random()*.35;p.a=.015+Math.random()*.025}
function init(){particles=Array.from({length:28},()=>{const p={};reset(p);p.y=Math.random()*canvas.height;return p})}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);for(const p of particles){p.y-=p.v;p.x+=Math.sin(p.y*.008)*.12;if(p.y+p.r<0)reset(p);const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,`rgba(255,255,255,${p.a})`);g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}requestAnimationFrame(draw)}
addEventListener('resize',()=>{resize();init()});resize();init();draw();
</script>
</body>
</html>
